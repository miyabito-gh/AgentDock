<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AgentDock モック</title>
<!--
AgentDock 操作モック（正本 AgentDock_Requirements.md 1.0 §10 を入力に作成、2026-10-05）
製品実装・Codex接続・技術成立の証拠ではない。データは例で、再読込みで初期化される。外部通信なし。

デザイン計画（frontend-design の手順）
  題材: Windows 11 上で Codex を使う個人用クライアント。主作業は会話、常時の関心は「どのエージェントが今どうなっているか」。
  色:   paper #F3F5F4 / surface #FFFFFF / rail #E7ECEB / ink #1B2A31 / harbor #1E4D6B（主色）
        状態は信号旗の考え方で色＋文字＋形を併用: 実行中 #2462A8 / 対応待ち #E2B12F（文字は濃色）/ 失敗 #B3261E /
        中断 #6E56A0 / 完了 #5E6E75 / 不明 斜線
  書体: BIZ UDPGothic（Windows標準のUD書体。小さい文字の判読性）、ID・パス・コードのみ Cascadia Mono
  配置: 合意済みの三領域（左 履歴／中央 会話／右 ドック）＋文字だけの上部メニュー。ボタン28px・送信32px・アイコン14px。
  方針: 大胆さは右の「ドック」1か所に集める。エージェントは係留線（親子線）でつながった停泊札として並び、
        状態は小さな信号旗で示す。他の領域は静かに保つ。
  見直し: 当初案「全面カード＋同じ影」はSaaSカードの既定に寄るため、カードは監視の停泊札だけにし、影は使わず
        左の状態帯と係留線で階層を示す形に変更。全大文字の見出し・中黒つなぎ・ボタンの「→」は使わない。
-->
<style>
:root{
  --paper:#F3F5F4; --surface:#FFFFFF; --rail:#E7ECEB; --ink:#1B2A31; --ink2:#4C5E66; --ink3:#73848B;
  --line:#D3DBDA; --line2:#E3E9E8; --harbor:#1E4D6B; --harbor-ink:#FFFFFF; --harbor-weak:#E2ECF2;
  --run:#2462A8; --run-bg:#E6EEF8; --wait:#E2B12F; --wait-ink:#5B4300; --wait-bg:#FFF6DA;
  --fail:#B3261E; --fail-bg:#FBEAE8; --int:#6E56A0; --int-bg:#EFEBF6; --done:#5E6E75; --done-bg:#EEF1F1;
  --unk:#8A979C; --stale:#9A6A00;
  --r-s:4px; --r-m:7px; --r-l:10px;
  --font:"BIZ UDPGothic","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --mono:"Cascadia Mono","Consolas",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:13px/1.6 var(--font);color:var(--ink);background:#C9D3D2;}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid transparent;background:transparent;border-radius:var(--r-s);height:28px;padding:0 9px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
button:hover{background:var(--harbor-weak)}
button:disabled{opacity:.45;cursor:not-allowed;background:transparent}
:focus-visible{outline:2px solid var(--run);outline-offset:2px}
.btn-line{border-color:var(--line);background:var(--surface)}
.btn-line:hover{border-color:#B9C5C4;background:var(--surface)}
.btn-main{background:var(--harbor);color:var(--harbor-ink)}
.btn-main:hover{background:#163C55}
.btn-danger{border-color:#E3B9B5;color:var(--fail);background:var(--surface)}
.btn-danger:hover{background:var(--fail-bg)}
svg.i{width:14px;height:14px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
input[type=text],input[type=search],select,textarea{border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface);padding:4px 8px}
input[type=text],input[type=search],select{height:28px}
label{display:inline-flex;align-items:center;gap:6px}
.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--ink3)}
.small{font-size:11.5px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* window frame */
.window{position:fixed;inset:16px;display:flex;flex-direction:column;background:var(--paper);border:1px solid #9FB0AF;border-radius:var(--r-l);overflow:hidden}
.titlebar{height:34px;display:flex;align-items:center;gap:10px;padding-left:12px;background:var(--surface);border-bottom:1px solid var(--line2);-webkit-user-select:none;user-select:none}
.app-mark{width:16px;height:16px;border-radius:3px;background:var(--harbor);position:relative;flex:none}
.app-mark:after{content:"";position:absolute;left:3px;right:3px;bottom:3px;height:3px;background:#fff;border-radius:1px}
.titlebar .title{font-weight:700}
.mock-tag{font-size:11px;color:var(--ink3);border:1px dashed var(--line);border-radius:var(--r-s);padding:0 6px}
.titlebar .grow{flex:1}
.winbtn{width:46px;height:34px;border-radius:0;justify-content:center;padding:0}
.winbtn:hover{background:var(--rail)}
.winbtn.close:hover{background:#C42B1C;color:#fff}
.menubar{display:flex;gap:2px;padding:2px 8px;background:var(--surface);border-bottom:1px solid var(--line)}
.menu{position:relative}
.menu > button{height:26px}
.menu > button[aria-expanded=true]{background:var(--harbor-weak)}
.dropdown{position:absolute;left:0;top:28px;z-index:30;min-width:250px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:4px;box-shadow:0 8px 24px rgba(27,42,49,.14)}
.dropdown button{width:100%;justify-content:space-between;height:30px}
.dropdown .kbd{color:var(--ink3);font-size:11px}
.dropdown hr{border:0;border-top:1px solid var(--line2);margin:4px 2px}
.tag{font-size:10.5px;line-height:16px;padding:0 5px;border-radius:3px;border:1px solid var(--line);color:var(--ink2);background:var(--paper)}
.tag.unv{border-color:#E4CF92;background:var(--wait-bg);color:var(--wait-ink)}
.tag.ai{border-color:#B9CDDA;background:var(--harbor-weak);color:var(--harbor)}

/* global banner */
.gbanner{display:flex;align-items:center;gap:10px;padding:6px 12px;border-bottom:1px solid;font-size:12.5px}
.gbanner.warn{background:var(--wait-bg);border-color:#EBD596;color:var(--wait-ink)}
.gbanner.err{background:var(--fail-bg);border-color:#EBC2BE;color:#7A1A14}
.gbanner .grow{flex:1;min-width:0}

/* layout */
.body{flex:1;display:grid;grid-template-columns:var(--lw,232px) minmax(0,1fr) var(--rw,300px);min-height:0}
.body.l-off{--lw:0px}.body.r-off{--rw:0px}
.left,.right{min-height:0;overflow:hidden}
.left{background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column}
.right{background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column}
.l-off .left,.r-off .right{display:none}
.left{grid-column:1}.center{grid-column:2}.right{grid-column:3}
.center{min-width:0;display:flex;flex-direction:column;min-height:0;background:var(--surface)}

/* left list */
.left-top{padding:10px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.left-top .btn-line{justify-content:flex-start}
.left-scroll{overflow:auto;flex:1;padding:6px 6px 12px}
.list-h{font-size:11.5px;color:var(--ink3);margin:10px 6px 4px;display:flex;justify-content:space-between}
.row-chat{width:100%;height:auto;min-height:44px;display:grid;grid-template-columns:1fr auto;align-items:center;text-align:left;padding:6px 8px;border-radius:var(--r-m);gap:2px 6px}
.row-chat:hover{background:#DCE4E3}
.row-chat.sel{background:var(--surface);border-color:var(--line)}
.row-chat .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-chat .sub{grid-column:1/-1;font-size:11.5px;color:var(--ink2);display:flex;gap:6px;align-items:center;overflow:hidden;white-space:nowrap}
.marks{display:flex;gap:4px}
.mark{font-size:10.5px;line-height:16px;padding:0 5px;border-radius:3px;font-weight:700}
.mark.wait{background:var(--wait);color:#3A2B00}
.mark.fail{background:var(--fail);color:#fff}
.mark.hold{background:var(--int);color:#fff}
.left-foot{border-top:1px solid var(--line);padding:6px 10px;font-size:11.5px;color:var(--ink2);display:flex;justify-content:space-between}

/* center */
.chead{display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--line2);min-height:48px}
.chead .ttl{font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chead .meta{display:flex;gap:8px;align-items:center;color:var(--ink2);font-size:11.5px;flex-wrap:wrap;min-width:0}
.chead .meta .mono{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;min-width:0}
.chead .grow{flex:1;min-width:0}
.fresh{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:0 6px;border-radius:3px;line-height:18px}
.fresh:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.fresh.live{color:#1F6B45;background:#E5F3EB}
.fresh.stale{color:var(--stale);background:var(--wait-bg)}
.fresh.stale:before{background:transparent;border:1.5px dashed currentColor}
.fresh.check{color:var(--wait-ink);background:var(--wait-bg)}
.fresh.off{color:var(--fail);background:var(--fail-bg)}
.goal{display:flex;gap:8px;align-items:center;padding:5px 16px;border-bottom:1px solid var(--line2);background:#F7F9F8;font-size:12px}
.goal b{color:var(--harbor)}
.cbanner{margin:10px 16px 0;border:1px solid;border-radius:var(--r-m);padding:10px 12px;font-size:12.5px}
.cbanner h4{margin:0 0 4px;font-size:13px}
.cbanner.warn{background:var(--wait-bg);border-color:#EBD596}
.cbanner.err{background:var(--fail-bg);border-color:#EBC2BE}
.cbanner.info{background:var(--harbor-weak);border-color:#C3D5E1}
.cbanner .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.targets{margin:6px 0 0;padding:0;list-style:none;display:grid;gap:3px}
.targets li{display:grid;grid-template-columns:150px 1fr;gap:8px}
.msgs{flex:1;overflow:auto;padding:16px 16px 8px}
.msg{max-width:760px;margin:0 auto 16px}
.msg .who{font-size:11.5px;color:var(--ink3);margin-bottom:3px;display:flex;gap:8px}
.msg.user .bubble{background:var(--paper);border:1px solid var(--line2);border-radius:var(--r-l);padding:8px 12px;margin-left:60px}
.msg.ai .bubble p{margin:0 0 8px}
.msg pre{background:#F6F8F8;border:1px solid var(--line2);border-radius:var(--r-s);padding:8px 10px;overflow:auto;font:12px/1.5 var(--mono);margin:6px 0}
.msg .acts{display:flex;gap:2px;margin-top:2px;color:var(--ink3)}
.msg .acts button{height:24px;font-size:11.5px}
.activity{font-size:12px;color:var(--ink2);border-left:2px solid var(--line);padding:2px 0 2px 10px;margin:6px 0}
.activity summary{cursor:pointer}
.files{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.file{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:var(--r-s);padding:2px 4px 2px 8px;font-size:12px;background:var(--surface)}
.file.missing{border-style:dashed;color:var(--ink3)}
.req{max-width:760px;margin:0 auto 16px;border:1px solid #EBD596;background:var(--wait-bg);border-radius:var(--r-m);padding:10px 12px}
.req .h{display:flex;gap:8px;align-items:center;font-weight:700;color:var(--wait-ink)}
.req .t{margin:6px 0;font-size:12.5px}
.req code{display:block;background:#FFFDF4;border:1px solid #EFE2B6;border-radius:var(--r-s);padding:6px 8px;font:12px/1.5 var(--mono);overflow-wrap:anywhere}
.req .opts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.req .scope{font-size:11.5px;color:var(--wait-ink);margin-top:6px}

/* composer */
.queue{max-width:792px;width:100%;margin:0 auto;padding:0 16px}
.queue details{border:1px solid var(--line);border-radius:var(--r-m);margin-bottom:6px;background:#FAFBFB}
.queue summary{cursor:pointer;padding:5px 10px;font-size:12px;display:flex;gap:8px;align-items:center}
.queue summary::-webkit-details-marker{display:none}
.qitem{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;padding:5px 10px;border-top:1px solid var(--line2);font-size:12px}
.qitem .why{font-size:11.5px;color:var(--wait-ink)}
.qitem .why.err{color:var(--fail)}
.qnum{font-family:var(--mono);color:var(--ink3)}
.composer{max-width:792px;width:100%;margin:0 auto;padding:4px 16px 12px}
.shell{border:1px solid #BCC8C7;border-radius:var(--r-l);background:var(--surface);padding:6px 8px}
.shell:focus-within{border-color:var(--harbor)}
.shell.locked{background:#F6F7F7}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 4px}
.chip{display:inline-flex;flex-wrap:wrap;align-items:center;gap:2px 6px;border:1px solid var(--line);border-radius:var(--r-s);padding:1px 2px 1px 6px;font-size:11.5px;background:var(--paper);max-width:100%}
.chip .st{color:var(--ink3)}
.chip.bad{border-color:#EBC2BE;background:var(--fail-bg)}
.chip.bad .st{color:var(--fail)}
.chip button{height:20px;padding:0 4px}
.thumb{width:22px;height:22px;border-radius:3px;background:linear-gradient(135deg,#9FC2D8,#476E86);flex:none}
textarea{width:100%;border:0;resize:none;min-height:56px;max-height:160px;padding:4px;outline:none;background:transparent;line-height:1.6}
.ctrl{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.ctrl .grow{flex:1}
.ctrl select{border:0;background:transparent;height:26px;padding:0 4px;font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden}
.seg button{border-radius:0;height:24px;font-size:11.5px}
.seg button[aria-pressed=true]{background:var(--harbor);color:#fff}
.send{width:32px;height:32px;justify-content:center;padding:0;border-radius:var(--r-m)}
.send svg.i{width:17px;height:17px}
.hint{font-size:11.5px;color:var(--ink3);margin-top:4px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.lockmsg{font-size:12px;color:var(--fail);padding:4px}

/* right dock */
.dock-top{padding:8px 10px;border-bottom:1px solid var(--line2);display:flex;flex-direction:column;gap:6px}
.dock-top .seg{align-self:flex-start}
.dock-scroll{flex:1;overflow:auto;padding:8px 10px 14px}
.root-h{display:flex;align-items:center;gap:6px;margin:10px 0 4px;font-size:12px;font-weight:700}
.root-h button{height:22px;font-size:11.5px;font-weight:400}
.tree{list-style:none;margin:0;padding:0}
.tree .tree{margin-left:13px;padding-left:12px;border-left:1.5px solid #B8C6C5}
.tree li{position:relative}
.tree .tree > li:before{content:"";position:absolute;left:-12px;top:19px;width:11px;border-top:1.5px solid #B8C6C5}
.tree .tree > li:last-child:after{content:"";position:absolute;left:-13.5px;top:20px;bottom:0;border-left:3px solid var(--surface)}
.berth{border:1px solid var(--line);border-left:4px solid var(--done);border-radius:var(--r-s);padding:5px 8px;margin:4px 0;background:var(--surface)}
.berth.run{border-left-color:var(--run)} .berth.wait{border-left-color:var(--wait);background:#FFFCF1}
.berth.fail{border-left-color:var(--fail);background:#FFF8F7} .berth.int{border-left-color:var(--int)}
.berth.unk{border-left-color:var(--unk);border-left-style:dashed}
.berth.stale{border-style:dashed}
.berth .l1{display:flex;align-items:center;gap:6px}
.berth .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.berth .rel{font-size:10.5px;color:var(--ink3)}
.berth .l2{font-size:11.5px;color:var(--ink2);margin-top:1px}
.berth .l3{font-size:11.5px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.berth .l4{font-size:10.5px;color:var(--ink3);display:flex;gap:8px;margin-top:1px}
.berth .acts{display:flex;gap:4px;margin-top:4px}
.berth .acts button{height:24px;font-size:11.5px}
.st{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;margin-left:auto;white-space:nowrap}
.st svg{width:11px;height:11px}
.st.run{color:var(--run)} .st.wait{color:var(--wait-ink)} .st.fail{color:var(--fail)} .st.int{color:var(--int)}
.st.done{color:var(--done)} .st.unk{color:var(--unk)} .st.idle{color:var(--ink2)}
.flag{fill:currentColor;stroke:none}
.flag.unk{fill:url(#hatch)}
.empty-note{font-size:12px;color:var(--ink3);padding:14px 4px;text-align:center}
.dock-foot{border-top:1px solid var(--line2);padding:6px 10px;font-size:11px;color:var(--ink3)}

/* overlays */
.scrim{position:fixed;inset:0;background:rgba(20,32,38,.32);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.dialog{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);width:min(620px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 16px 48px rgba(20,32,38,.25)}
.dialog.wide{width:min(860px,100%)}
.dialog header{display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line2)}
.dialog header h3{margin:0;font-size:14px;flex:1}
.dialog .content{padding:12px 14px;overflow:auto}
.dialog footer{display:flex;justify-content:flex-end;gap:6px;padding:10px 14px;border-top:1px solid var(--line2)}
.dialog p{margin:0 0 8px}
.field{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;align-items:center;margin-bottom:10px}
.field .note{grid-column:2;font-size:11.5px;color:var(--ink3)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line2);padding:0 10px;overflow-x:auto;flex:none}
.tabs button{border-radius:0;height:32px;border-bottom:2px solid transparent}
.tabs button[aria-selected=true]{border-bottom-color:var(--harbor);font-weight:700}
.diff{display:grid;grid-template-columns:200px 1fr;gap:10px}
.diff pre{margin:0;font:12px/1.55 var(--mono);background:#F7F9F9;border:1px solid var(--line2);border-radius:var(--r-s);padding:6px 0;overflow:auto}
.diff pre span{display:block;padding:0 10px}
.diff .add{background:#E6F4EA}.diff .del{background:#FCE9E7}
.check-list{margin:6px 0;padding-left:18px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:var(--r-m);padding:8px 14px;z-index:60;font-size:12.5px;max-width:calc(100% - 32px)}

/* compact monitor window */
.mini{position:fixed;right:34px;bottom:34px;width:300px;max-height:420px;background:var(--surface);border:1px solid #9FB0AF;border-radius:var(--r-m);z-index:35;display:flex;flex-direction:column;box-shadow:0 10px 30px rgba(20,32,38,.22)}
.mini .titlebar{height:30px;gap:6px;padding-left:8px}
.mini .titlebar .title,.mini .titlebar label{white-space:nowrap;font-size:12px}
.mini .winbtn{width:38px;height:30px}
.mini .dock-scroll{padding:4px 8px 10px}
.mini .berth{padding:3px 6px}

/* mock control */
.mockctl{position:fixed;left:24px;bottom:24px;z-index:50}
.mockctl > button{background:var(--ink);color:#fff;border-radius:var(--r-m)}
.mockctl .panel{position:absolute;left:0;bottom:34px;width:280px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:6px;box-shadow:0 10px 30px rgba(20,32,38,.2)}
.mockctl .panel p{margin:4px 6px 6px;font-size:11.5px;color:var(--ink3)}
.mockctl .panel button{width:100%;justify-content:flex-start;height:28px}
.mockctl .panel button[aria-current=true]{background:var(--harbor-weak);font-weight:700}

/* narrow: D07 left/right become temporary panels */
@media (max-width:900px){
  .window{inset:0;border-radius:0;border:0}
  .body{grid-template-columns:minmax(0,1fr)!important}
  .left,.right{position:fixed;top:0;bottom:0;z-index:25;width:min(300px,86vw);display:none;box-shadow:0 0 30px rgba(20,32,38,.25)}
  .left{left:0}.right{right:0}
  .center{grid-column:1}
  .body.n-l .left,.body.n-r .right{display:flex}
  .winbtn{width:38px}
  .titlebar .mock-tag{display:none}
  .chead{padding:8px 10px;flex-wrap:wrap}
  .chead .grow{order:-1;flex-basis:100%}
  .chead .hide-s{display:none}
  .gbanner{flex-wrap:wrap}
  .gbanner .grow{flex-basis:calc(100% - 30px)}
  .msgs{padding:12px 10px}
  .msg.user .bubble{margin-left:20px}
  .composer,.queue{padding-left:10px;padding-right:10px}
  .field{grid-template-columns:1fr}
  .field .note{grid-column:1}

// ---------- dock ----------
function dockChats(scope) {
  return scope === "sel" ? S.chats.filter(c => c.id === S.sel) : S.chats;
}
function visibleAgents(c, scope) {
  const doneLike = s => ["done", "closed", "interrupted"].includes(s);
  return c.agents.filter(x => {
    if (scope === "sel") return true;                       // 選択中: 完了済みも常に表示
    if (x.state === "failed") return S.fails[x.id] !== "confirmed" || S.showDone;
    if (doneLike(x.state) || x.state === "idle") return S.showDone;
    return true;                                             // 作業中・対応待ち・不明は基本対象
  });
}
function dockPane(mini) {
  const scope = mini ? S.miniScope : S.scope;
  const chats = dockChats(scope).filter(c => scope === "sel" || visibleAgents(c, scope).length);
  return `<div class="dock-top">
      ${mini ? "" : `<div style="display:flex;align-items:center;gap:6px"><b style="flex:1">エージェントのドック</b><button class="only-narrow small" data-act="toggleRight">閉じる</button></div>`}
      <span class="seg" role="group" aria-label="表示範囲"><button aria-pressed="${scope === "sel"}" data-scope="sel" data-mini="${mini}">選択中のチャット</button><button aria-pressed="${scope === "all"}" data-scope="all" data-mini="${mini}">全チャット</button></span>
      ${scope === "all" ? `<label class="small"><input type="checkbox" data-act="toggleDone" ${S.showDone ? "checked" : ""}>終了済みも表示（完了・停止・確認済みの失敗）</label>` : `<span class="small muted">完了したエージェントも表示しています</span>`}
    </div>
    <div class="dock-scroll">
      ${chats.length ? chats.map(c => rootBlock(c, scope, mini)).join("") : `<div class="empty-note">${S.chats.length ? "作業中・対応待ちのエージェントはありません" : "チャットを始めると、ここにエージェントが表示されます"}</div>`}
    </div>
    ${mini ? "" : `<div class="dock-foot">状態は Codex から取得した情報です。取得できない項目は「未取得」と表示します。</div>`}`;
}
function rootBlock(c, scope, mini) {
  const ags = visibleAgents(c, scope);
  const known = new Set(c.agents.map(a => a.id));
  const kids = p => ags.filter(a => a.parent === p);
  const node = a => `<li>${berth(a, c, mini)}${kids(a.id).length ? `<ul class="tree">${kids(a.id).map(node).join("")}</ul>` : ""}</li>`;
  const roots = ags.filter(a => a.parent === null || (a.parent !== "?" && !known.has(a.parent)) || (a.parent && a.parent !== "?" && !ags.find(x => x.id === a.parent)));
  const orphan = ags.filter(a => a.parent === "?");
  return `<div>${scope === "all" || mini ? `<div class="root-h"><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.name)}</span>${c.archived ? `<span class="tag">アーカイブ</span>` : ""}${c.id !== S.sel ? `<button data-chat="${c.id}">開く</button>` : ""}</div>` : ""}
    <ul class="tree">${roots.map(node).join("")}</ul>
    ${orphan.length ? `<div class="small muted" style="margin:6px 0 0">直接の親が分からないエージェント</div><ul class="tree">${orphan.map(a => `<li>${berth(a, c, mini)}</li>`).join("")}</ul>` : ""}</div>`;
}
function berth(a, c, mini) {
  const m = STATE[a.state] || STATE.unknown;
  const depth = (() => { let d = 0, p = a.parent; while (p && p !== "?") { d++; p = (c.agents.find(x => x.id === p) || {}).parent; } return d; })();
  const rel = a.parent === "?" ? "親不明" : ["メイン", "子", "孫", "ひ孫"][depth] || `${depth}階層下`;
  const failUnconf = a.state === "failed" && S.fails[a.id] === "unconfirmed";
  return `<div class="berth ${m.c} ${a.stale ? "stale" : ""}">
    <div class="l1"><span class="nm">${esc(a.name)}</span><span class="rel">${rel}</span>${stBadge(a.state)}</div>
    ${mini ? "" : `<div class="l2">役割: ${esc(a.role)}　担当: ${esc(a.task)}</div>`}
    <div class="l3" title="${esc(a.act)}">${esc(a.act)}</div>
    ${mini ? "" : `<div class="l4"><span>${esc(a.at)}</span><span>${esc(a.src)}</span>${a.stale ? `<span style="color:var(--stale)">live未復旧</span>` : ""}</div>`}
    ${failUnconf && !mini ? `<div class="acts"><button class="btn-line" data-confirm="${a.id}">${icon("check")}失敗を確認済みにする</button></div>` : ""}</div>`;
}

// ---------- actions ----------
let toastTimer;
function toast(t) { S.toast = t; clearTimeout(toastTimer); toastTimer = setTimeout(() => { S.toast = null; render(); }, 2600); }
function info(title, html) { S.dialog = { type:"info", title, html }; }
function act(a, el) {
  const c = chat();
  if (a.startsWith("unv:")) { S.dialog = { type:"unv", why:a.slice(4) }; return; }
  if (a.startsWith("settings:")) { S.dialog = { type:"settings", tab:a.split(":")[1] }; return; }
  switch (a) {
    case "noop": break;
    case "closeToTray": toast("トレイに格納しました。作業と監視は続いています。"); break;
    case "minimize": toast("最小化しました（モック）"); break;
    case "closeMini": S.mini = false; toast("監視窓だけを閉じました。作業は続いています。"); break;
    case "miniTop": S.miniTop = !S.miniTop; break;
    case "toggleTop": S.mainTop = !S.mainTop; toast(S.mainTop ? "通常画面を最前面に表示します" : "最前面を解除しました"); break;
    case "toggleLeft": if (narrow()) { S.lNarrow = !S.lNarrow; S.rNarrow = false; } else S.leftOpen = !S.leftOpen; break;
    case "toggleRight": if (narrow()) { S.rNarrow = !S.rNarrow; S.lNarrow = false; } else S.rightOpen = !S.rightOpen; break;
    case "toggleMini": S.mini = !S.mini; break;
    case "toggleDone": S.showDone = !S.showDone; break;
    case "archSearch": S.includeArchiveSearch = !S.includeArchiveSearch; break;
    case "showArchive": S.showArchive = true; break;
    case "hideArchive": S.showArchive = false; break;
    case "newChat": S.dialog = { type:"newChat" }; break;
    case "createChat": { const id = "n" + Date.now(); S.chats.unshift({ id, name:"新しいチャット", ai:"Codex", kind:"general", folder:null, pinned:false, archived:false, running:false, fresh:"live", model:"gpt-6.1-sol", effort:"中", accepted:{model:"gpt-6.1-sol", effort:"中"}, goal:"", draft:"", mode:"after", attach:[], queue:[], msgs:[], agents:[{id:id + "0", parent:null, name:"メイン", role:"main", task:"未取得", state:"idle", act:"最初の依頼を待っています", at:"—", src:"直接取得"}] }); S.sel = id; S.dialog = null; break; }
    case "rename": if (c) { const n = prompt("チャット名", c.name); if (n) c.name = n; } break;
    case "pin": if (c) c.pinned = !c.pinned; break;
    case "archive": if (c) { c.archived = !c.archived; toast(c.archived ? (c.running ? "アーカイブしました。作業・通知・送信待ちは続いています。" : "アーカイブしました") : "アーカイブから戻しました"); } break;
    case "export": S.dialog = { type:"export" }; break;
    case "doExport": S.dialog = null; toast("書き出しました（モック）"); break;
    case "delete": if (c) S.dialog = { type:"delete" }; break;
    case "doDelete": S.dialog = null; if (c.running) { applyScenario("deletePending"); } else { S.chats = S.chats.filter(x => x !== c); S.sel = S.chats[0] && S.chats[0].id; toast("削除しました"); } break;
    case "cancelDelete": delete S.holdDelete[c.id]; delete S.locked[c.id]; delete S.cBanner[c.id]; toast("削除を取り消しました。実行状態はまだ確認できていません。"); break;
    case "quit": S.dialog = { type:"quit" }; break;
    case "quitStop": S.dialog = null; applyScenario("stop"); break;
    case "interrupt": if (c && c.running) { toast("中断を要求しました。停止を確認しています…"); setTimeout(() => { if (S.scenario !== "stop") { applyScenario("stop"); render(); } }, 1200); } break;
    case "wait": toast("引き続き停止を確認します"); break;
    case "retry": toast("中断を再試行しました"); break;
    case "cancelQuit": delete S.cBanner[c.id]; c.agents.forEach(x => { if (x.state === "interrupted") x.state = "running"; }); toast("終了を取り消しました。作業と監視は続いています。"); break;
    case "force": S.dialog = { type:"force" }; break;
    case "doForce": S.dialog = null; toast("強制終了を要求しました。停止の確認を続けます。"); break;
    case "recheck": toast("状態を照合しています…"); break;
    case "reread": toast("保存履歴を再取得しました"); break;
    case "reconcile": toast("履歴と照合しています。一致を確認できるまで再送しません。"); break;
    case "resumeQueue": c.queue.forEach(q => { if (q.st === "stopped") { q.st = "wait"; delete q.why; } }); toast("残りの依頼を登録順に送ります"); break;
    case "resumeExt": toast("外部での実行が終わったことを確認できたら再開します（モック）"); break;
    case "retryLaunch": toast("起動を再試行しています…"); break;
    case "ack": delete S.cBanner[c.id]; break;
    case "login": info("ChatGPT に再ログイン", "<p>公式のログイン画面をブラウザで開きます。AgentDock がパスワードを受け取ることはありません。</p>"); break;
    case "usage": info("利用状況", "<p>5時間枠: 上限に到達（15:10 にリセット）</p><p>週の枠: 62%</p><p class='small muted'>残量を取得できないときは「不明」と表示します。</p>"); break;
    case "retrySave": toast("保存を再試行しています…"); break;
    case "diff": S.dialog = { type:"diff" }; break;
    case "undo": info("変更を戻す", "<p>次の変更を戻します。</p><ul class='check-list'><li>src/reconnect.rs（このチャットで変更）</li></ul><p class='small muted'>tests/reconnect.rs には作業前からの変更が含まれるため、対象から外しました。</p>"); break;
    case "review": info("コードレビュー", "<div class='field'><span>対象</span><span><label><input type='radio' name='rv' checked>未コミットの変更</label>　<label><input type='radio' name='rv'>基準ブランチとの差分</label></span></div><div class='field'><span>結果の表示先</span><span><label><input type='radio' name='rd' checked>このチャット</label>　<label><input type='radio' name='rd'>別のチャット</label></span></div>"); break;
    case "fork": toast("この時点から分岐した新しいチャットを作りました（分岐元に戻る導線を表示）"); break;
    case "compact": info("文脈を圧縮", "<p>会話の文脈を圧縮します。圧縮前の本文は保存されたまま、後から読めます。</p><p class='small muted'>受付と完了は分けて表示します。</p>"); break;
    case "reference": info("過去の会話を参考に指定", "<p>参考にする会話を選ぶと、送信前に参照する範囲を表示します。</p>"); break;
    case "goal": S.dialog = { type:"goal" }; break;
    case "goalClear": c.goal = ""; toast("Goal を解除しました"); break;
    case "side": S.dialog = { type:"side" }; break;
    case "sideHand": S.dialog = null; toast("選んだ内容を主の会話の入力欄へ渡しました（自動では送信しません）"); break;
    case "help": info("状態の見方", "<p>旗の色と文字で状態を示します。実行中（青）、対応待ち（黄）、失敗（赤）、中断（紫）、完了（灰）、状態不明（斜線）。</p><p>「受信中」「live未復旧」「要照合」「切断」は情報の鮮度で、エージェントの状態とは別です。</p>"); break;
    case "status": info("Codex の状態", "<p>codex-cli 0.160.0（App Server、stdio）</p><p>アカウント: ChatGPT</p>"); break;
    case "about": info("バージョン情報", "<p>AgentDock 操作モック（正本 1.0 §10）</p>"); break;
    case "attachMenu": S.dialog = { type:"attach" }; break;
    case "addFile": c.attach.push({type:"file", name:"仕様メモ.docx", st:"コピー済み", at:"10/05 14:40"}); S.dialog = null; break;
    case "addImage": c.attach.push({type:"img", name:"貼り付け画像.png", st:"コピー済み", at:"10/05 14:41"}); S.dialog = null; break;
    case "openFile": toast("関連付けられたアプリで開きます（モック）"); break;
    case "saveFile": toast("保存先を選んでください。同名のファイルがあれば確認します。"); break;
    case "copy": toast("コピーしました"); break;
    case "send": send(c); break;
    case "closeDialog": S.dialog = null; break;
    case "mockToggle": S.mock = !S.mock; break;
  }
}
function send(c) {
  const t = c.draft.trim();
  if (!t) { toast("メッセージを入力してください"); return; }
  if (c.running && c.mode === "after") { c.queue.push({ text:t, st:"wait" }); toast("完了後に送る依頼として登録しました"); }
  else if (c.running) { c.msgs.push({ who:"user", text:"（追加指示）" + t }); toast("現在の作業への追加指示を送りました。反映されたかは応答で確認します。"); }
  else { c.msgs.push({ who:"user", text:t }); c.running = true; const m = c.agents.find(x => !x.parent); if (m) { m.state = "running"; m.act = "依頼を処理中"; } }
  c.draft = "";
  if (c.name === "新しいチャット") c.name = t.replace(/\s+/g, " ").slice(0, 18);
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act],[data-menu],[data-chat],[data-scope],[data-mode],[data-tab],[data-scn],[data-req],[data-confirm],[data-qdel],[data-qedit],[data-unattach],[data-enter]");
  if (!el) { if (S.menu) { S.menu = null; render(); } return; }
  if (el.dataset.act === "closeDialogBg" && e.target !== el) return;
  const d = el.dataset;
  if (d.menu) { S.menu = S.menu === d.menu ? null : d.menu; render(); return; }
  S.menu = null;
  if (d.act === "closeDialogBg") { S.dialog = null; }
  else if (d.act) act(d.act, el);
  else if (d.chat) { S.sel = d.chat; S.lNarrow = false; S.rNarrow = false; }
  else if (d.scope) { if (d.mini === "true") S.miniScope = d.scope; else S.scope = d.scope; }
  else if (d.mode) chat().mode = d.mode;
  else if (d.tab) S.dialog.tab = d.tab;
  else if (d.scn) { applyScenario(d.scn); S.mock = true; }
  else if (d.req) { const r = S.reqs.find(x => x.id === d.req); S.reqs = S.reqs.filter(x => x !== r); const c = chat(r.chat); const w = c.agents.find(x => x.state === "waiting"); if (w) { w.state = "running"; w.act = "回答を受けて続行"; } toast(`回答を送りました: ${d.ans === "deny" ? "拒否" : d.ans === "once" ? "1回だけ許可" : d.ans === "session" ? "このセッション中は許可" : d.ans}`); }
  else if (d.confirm) { S.fails[d.confirm] = "confirmed"; toast("確認済みにしました。失敗の記録は残り、キューは再開しません。"); }
  else if (d.qdel) { chat().queue.splice(+d.qdel, 1); }
  else if (d.qedit) { const q = chat().queue[+d.qedit]; const n = prompt("依頼を編集", q.text); if (n) q.text = n; }
  else if (d.unattach) { chat().attach.splice(+d.unattach, 1); }
  else if (d.enter) S.enter = d.enter;
  render();
});
document.addEventListener("input", e => {
  if (e.target.id === "draft") { chat().draft = e.target.value; return; }
  if (e.target.id === "q") { S.query = e.target.value; render(); }
});
document.addEventListener("change", e => {
  const s = e.target.dataset.sel; if (!s) return;
  const c = chat(); c[s] = e.target.value; render();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { if (S.dialog) { S.dialog = null; render(); return; } if (S.menu) { S.menu = null; render(); return; } }
  if (e.target.id === "draft" && e.key === "Enter") {
    const sendNow = S.enter === "ctrl" ? e.ctrlKey : !e.shiftKey && !e.ctrlKey;
    if (sendNow) { e.preventDefault(); send(chat()); render(); }
  }
  if (e.ctrlKey && (e.key === "n" || e.key === "N")) { e.preventDefault(); S.dialog = { type:"newChat" }; render(); }
});
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("drop", e => {
  e.preventDefault(); const c = chat(); if (!c || S.locked[c.id]) return;
  [...e.dataTransfer.files].forEach(f => c.attach.push({ type:/^image\//.test(f.type) ? "img" : "file", name:f.name, st:"コピー済み（モックでは名前だけ）", at:"今" }));
  render();
});
render();
</script>
</body>
