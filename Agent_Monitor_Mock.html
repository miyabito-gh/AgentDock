/* Compact controls and agent cards: one shared desktop scale. */
button{font-size:12px;line-height:20px;min-height:28px;padding:4px 8px;border-radius:6px}
.menu-trigger,.icon-button{font-size:12px;padding:4px 8px}
.dropdown button{font-size:12px;padding:5px 9px;min-height:30px}
.reply-actions button{font-size:11px;min-height:26px;padding:3px 7px}
.send{width:32px;min-width:32px;height:32px;padding:4px;border-radius:7px;font-size:16px}
.input-pickers select{height:28px;padding:3px 5px;line-height:20px}
.input-pickers button{width:28px;padding:4px}
.chip button{min-height:22px;line-height:20px;padding:0 4px}
.sidebar .new{min-height:30px}.chat-row{padding:10px 11px}
.monitor{padding:20px 14px}.monitor h2{font-size:14px}
.monitor select{height:30px;margin:10px 0 14px;padding:4px 7px;background:white}
.tree{margin:0;padding:0;border:0;display:flex;flex-direction:column;gap:9px;margin-bottom:18px}
.agent-group-title{font-size:12px!important;margin:16px 0 9px!important;overflow-wrap:anywhere}
.agent-card{position:relative;border:1px solid var(--line);border-radius:9px;background:white;padding:11px 12px;box-shadow:0 1px 2px #293c5305;min-width:0}
.agent-card.root{border-color:#bdcddd;background:#fdfefe}
.agent-card.child{margin-left:12px}
.agent-card.child:before{content:'';position:absolute;left:-13px;top:20px;width:12px;border-top:1px solid #bdcddd}
.agent-card.child:after{content:'';position:absolute;left:-13px;top:-10px;bottom:-10px;border-left:1px solid #bdcddd}
.agent-card.child:last-child:after{bottom:calc(100% - 21px)}
.agent-card-head{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap}
.agent-card strong{font-size:12px;font-weight:600;overflow-wrap:anywhere}
.agent-card .state{margin:0;font-size:10px;line-height:18px;padding:0 6px;white-space:nowrap}
.agent-relation{font-size:10px;color:var(--muted);margin-bottom:5px;overflow-wrap:anywhere}
.agent-card .activity{font-size:12px;line-height:1.65;margin-top:8px;overflow-wrap:anywhere}
.agent-card.wait{border-color:#e7d5ae}.agent-card.fail{border-color:#e4bdc2}
.agent-card.done{background:#fafbfc}.agent-card button{margin-top:9px;width:100%;font-size:11px;min-height:28px}
@media(pointer:coarse){button{min-height:36px}.send{width:36px;height:36px;min-width:36px}.chip button{min-height:28px}.input-pickers button{width:36px}.reply-actions button{min-height:32px}}
.ui-icon{width:14px;height:14px;display:inline-block;vertical-align:-2px;flex-shrink:0;pointer-events:none;stroke-width:1.7}.menu-trigger,.icon-button,.reply-actions button,.new,.agent-card button{display:inline-flex;align-items:center;gap:6px}.dropdown button>span{display:inline-flex;align-items:center;gap:8px}.state .ui-icon{width:11px;height:11px;margin-right:4px;vertical-align:-1px}.send{display:inline-grid;place-items:center}.send .ui-icon{width:17px;height:17px}.chat-name .ui-icon{margin-right:5px}.agent-card-head strong .ui-icon{margin-right:5px}.chip>.ui-icon{width:12px;height:12px}.menu-trigger{gap:5px}@media(max-width:420px){.menu-trigger{gap:4px;padding-left:6px;padding-right:6px}}
</style></head><body>
<div class="app"><header class="titlebar"><div class="brand"><span class="logo">a</span>AgentDock</div><span class="mock-label">操作モック　サンプルデータ</span></header><nav class="menubar" aria-label="上部メニュー" id="menubar"></nav>
<div class="grid" id="grid"><aside class="sidebar" id="sidebar"><button class="outline new" data-action="new">＋ 新しいチャット</button><input id="search" class="search" aria-label="チャット名を検索" placeholder="チャットを検索"><div class="chat-list" id="chat-list"></div><div class="row"><small>アーカイブも含める</small><input id="include-archive" type="checkbox" aria-label="アーカイブも含める"></div></aside>
<main class="workspace"><header class="chat-head"><div class="row spread"><h1 id="chat-title"></h1><div class="row"><button class="icon-button" data-action="toggle-left" aria-label="チャット一覧の表示切替">一覧</button><button class="icon-button" data-action="toggle-right" aria-label="エージェント監視の表示切替">監視</button></div></div><small id="chat-folder"></small></header><section class="messages" id="messages" aria-label="会話"></section><footer class="composer"><details class="queue" id="queue"><summary id="queue-count"></summary><div id="queue-items"></div></details><div id="context-strip" class="context-strip"></div><div class="input-shell" id="input-shell"><textarea id="composer" aria-label="依頼を入力" placeholder="続きを依頼する…"></textarea><div class="input-controls"><div class="input-pickers"><button data-action="context" aria-label="ファイル・画像・参考会話を追加">＋</button><select id="model" aria-label="モデル"><option>Codexモデル（例）</option><option>別モデル（例）</option></select><select id="effort" aria-label="Reasoning effort"><option>medium</option><option>high</option></select><select id="plan" aria-label="計画または実行"><option>実行</option><option>計画</option></select><select id="send-mode" aria-label="実行中の送信方式"><option>完了後に送信</option><option>追加指示</option></select></div><button id="send" class="primary send" data-action="send" aria-label="送信">↑</button></div></div><div class="input-note" id="input-note">Enterで改行、Ctrl＋Enterで送信</div></footer></main>
<aside id="monitor" class="monitor"><div class="row spread"><h2 style="margin:0">エージェント</h2><small id="agent-count"></small></div><select id="scope" aria-label="監視範囲"><option>選択中チャット</option><option>全チャット</option></select><div id="agent-tree"></div><div class="monitor-footer"><label><input type="checkbox" id="show-ended"> 終了済みも表示</label><p style="margin:12px 0 0">接続：更新中（サンプル）</p></div></aside></div><footer class="footer"><span id="footer-mode">ローカル作業</span><span>Codexの通信・実作業は行いません</span></footer></div>
<div class="caption">上部メニューから、履歴管理・差分・レビュー・目標・連携設定などにアクセスできます。</div><input type="file" multiple id="file-input" hidden>
<div class="backdrop" id="backdrop" hidden><section class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><header class="dialog-head"><h2 id="dialog-title"></h2><button data-action="close-dialog" aria-label="閉じる">×</button></header><div id="dialog-content" class="dialog-content"></div><footer id="dialog-actions" class="dialog-actions"></footer></section></div>
<aside id="mini" class="mini" hidden aria-label="コンパクト監視窓"><div class="row spread"><h2>監視窓</h2><button data-action="close-mini" aria-label="監視窓を閉じる">×</button></div><select id="mini-scope" aria-label="監視窓の範囲"><option>選択中チャット</option><option>全チャット</option></select><div id="mini-content"></div><div class="row spread"><label><input type="checkbox" id="mini-top"> 最前面</label><button data-action="open-chat">会話を開く</button></div></aside><div class="toast" id="toast" aria-live="polite" hidden></div>
<script>
(()=>{'use strict';const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const chats=[{id:1,name:'通信処理の調査',folder:'C:\\Projects\\Terminal',state:'承認待ち',running:true,pinned:true,archived:false,draft:'',model:0,effort:0,plan:0,mode:0,contexts:[],queue:['調査結果をMarkdownにまとめてください。'],approval:true,goal:'通信の待ち条件と設計根拠を整理する',messages:[{user:true,text:'通信処理の待ち条件を調べて、設計書と実装に違いがないか確認してください。'},{user:false,text:'設計書と実装の通信順序を確認しました。続けて、待ち条件と例外処理を調べています。\n\nExplorerが待ち条件を調査し、Reviewerが設計書との対応を確認しています。'}],agents:[['メイン','承認待ち','参考資料の読取り許可を待機',0],['Explorer','作業中','通信の待ち条件を調査',1],['Researcher','完了','過去の設計記録を確認',1],['Reviewer','子待ち','調査結果を待機',1]]},{id:2,name:'問い合わせ対応の整理',folder:'チャット専用領域',state:'作業中・子の失敗あり',running:true,pinned:false,archived:false,draft:'',model:0,effort:0,plan:0,mode:0,contexts:[],queue:['記録をまとめてください。'],approval:false,goal:'',failure:true,messages:[{user:true,text:'問い合わせの記録を整理し、次に確認する点をまとめてください。'},{user:false,text:'対応記録を整理しています。子の調査で失敗があり、詳細を確認できます。'}],agents:[['メイン','作業中','対応記録を整理',0],['Explorer','失敗','参考資料の読取りに失敗',1]]},{id:3,name:'提案文の推敲',folder:'チャット専用領域',state:'完了',running:false,pinned:false,archived:false,draft:'',model:1,effort:0,plan:0,mode:0,contexts:[],queue:[],approval:false,goal:'',messages:[{user:true,text:'提案文を読みやすく整えてください。'},{user:false,text:'提案文の推敲が完了しました。\n課題と提案の関係が分かるよう、文章の順序を整理しています。'}],agents:[['メイン','完了','文章の推敲を完了',0]]}];let selected=1;let archivedOnly=false;let enterSend=false;let oldFocus=null;let activeMenu=null;let toastTimer;let nextId=4;const current=()=>chats.find(c=>c.id===selected);
function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,4000);}
function saveDraft(){const c=current();if(c){c.draft=$('#composer').value;c.model=$('#model').selectedIndex;c.effort=$('#effort').selectedIndex;c.plan=$('#plan').selectedIndex;c.mode=$('#send-mode').selectedIndex;}}
function closeMenu(){if(activeMenu){activeMenu.hidden=true;activeMenu.previousElementSibling.setAttribute('aria-expanded','false');activeMenu=null;}}
