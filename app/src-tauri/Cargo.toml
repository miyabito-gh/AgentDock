[package]
name = "agentdock"
version = "0.0.1"
description = "AgentDock - Codex agent monitor for Windows"
authors = [""]
edition = "2021"
rust-version = "1.60"

[lib]
name = "agentdock_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dev-dependencies]
ts-rs = { version = "12", features = ["serde-compat"] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "process", "io-util", "rt", "rt-multi-thread", "time", "macros"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Power"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-winrt-notification = "0.8"

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
