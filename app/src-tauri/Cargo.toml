[package]
name = "agentdock"
version = "0.0.1"
description = "AgentDock - Codex agent monitor for Windows"
authors = [""]
edition = "2021"
rust-version = "1.60"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["custom-protocol"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "process", "io-util", "rt", "time", "macros"] }

[features]
default = []

[profile.release]
codegen-units = 1
lto = true
