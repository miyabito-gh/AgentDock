<!doctype html><html><meta charset="utf-8"><title>V0 probe</title><body>
<iframe id="preview" sandbox="allow-scripts" allow="camera 'none'; microphone 'none'; geolocation 'none'" src="fixture.html"></iframe>
<script>
let count=0;
const forward=value=>{if(count++<40)chrome.webview.postMessage(JSON.stringify({kind:'fixture-observations',report:JSON.stringify(value).slice(0,512)}));};
addEventListener('message',e=>{if(e.source===document.querySelector('iframe').contentWindow)forward(e.data);});
forward({kind:'shell-ready'});
</script></body></html>
